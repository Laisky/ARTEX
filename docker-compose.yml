services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-artex}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?请在 .env 设置 POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-artex_local}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - artex
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-artex} -d ${POSTGRES_DB:-artex_local}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  artex:
    # 默认从当前源码构建，避免本地实验环境无意中运行未固定的远端镜像。
    image: artex-local:${ARTEX_TAG:-local}
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - artex
    environment:
      ARTEX_CONFIG: /app/config.json
      ARTEX_SKILL_DIR: /app/skills
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ARTEX_LLM_PROVIDER: ${ARTEX_LLM_PROVIDER:-}
      ARTEX_LLM_MODEL: ${ARTEX_LLM_MODEL:-}
      ARTEX_LLM_BASE_URL: ${ARTEX_LLM_BASE_URL:-}
      ARTEX_LLM_PROXY: ${ARTEX_LLM_PROXY:-}
    ports:
      # 仅绑定 Tailscale IPv4，避免监听 0.0.0.0。端口转发代理同样只在 tailnet 可达。
      - "${ARTEX_BIND_IP:?请在 .env 设置 Tailscale IPv4}:8787:8787"
      - "${ARTEX_BIND_IP:?请在 .env 设置 Tailscale IPv4}:8788:8788"
    volumes:
      # 配置文件、JWT 签名密钥、工作区、会话与流量数据均持久化到宿主机。
      - ./config.json:/app/config.json
      - ./jwt.key:/app/jwt.key
      - ./data:/app/data
      - ./skills:/app/skills
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8787/api/health >/dev/null"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 20s
    restart: unless-stopped

networks:
  # Private network for standalone deployments.
  artex:

volumes:
  pgdata:
    # 独立于 Compose 生命周期；docker compose down -v 也不会删除外部卷。
    external: true
    name: artex-local-pgdata
